  name: TANF Data Portal
  description: >-
    The TANF Data Portal (TDP) is a secure, web-based data reporting system for state agencies to submit
    Temporary Assistance for Needy Families (TANF) program data to ACF. It provides data submission workflows,
    validation, and reporting capabilities. The system is built on a Django/React stack hosted on Cloud.gov.
