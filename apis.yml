- aid: the-administration-for-children-and-families:ndacan
  name: National Data Archive on Child Abuse and Neglect
  description: >-
    NDACAN is the central repository for datasets related to child abuse, neglect, and child welfare at
    Cornell University, funded by ACF. Provides access to AFCARS (foster care/adoption), NCANDS (child
    abuse and neglect), and NYTD (youth in transition) datasets for research purposes. Includes data codebooks
    and user guides.
